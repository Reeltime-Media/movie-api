services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Internal only — do not publish 6379 to the public internet.
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    # Prefer pooler URL — direct db.* host often times out from Docker (IPv6 / routing).
    environment:
      - POOLER_DATABASE_URL=${POOLER_DATABASE_URL:-}
    # Do not bind-mount the repo: the image runs as uid 10001 and cannot read a
    # host .env mounted at 0600. Compose still injects env_file into the process.
    # Entrypoint/CMD come from the Dockerfile (migrations + uvicorn workers).

  transcode:
    build:
      context: .
      dockerfile: transcode_service/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${TRANSCODE_DATABASE_URL}
    depends_on:
      - api
