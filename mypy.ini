[mypy]
python_version = 3.12
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
files = app/services,app/core,app/workers
exclude = (?x)(^alembic/|^seed/|^tests/)

# Soft exclusions while we annotate gradually — still type-check the rest.
[mypy-app.services.catalog_search]
ignore_errors = true

[mypy-app.services.content_upload]
ignore_errors = true

[mypy-app.db_connect]
ignore_errors = true

[mypy-bakong_khqr.*]
ignore_missing_imports = true

[mypy-google.*]
ignore_missing_imports = true

[mypy-passlib.*]
ignore_missing_imports = true

[mypy-slowapi.*]
ignore_missing_imports = true
