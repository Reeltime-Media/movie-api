name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── CI: runs on every PR and push ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          # Repo locks with uv pip compile → requirements*.lock (no uv.lock).
          cache-dependency-glob: |
            **/requirements*.lock
            **/pyproject.toml

      - name: Install dependencies (locked)
        run: |
          uv pip install --system -r requirements-dev.lock

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Mypy (services + core + workers)
        run: mypy

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        # Only collect tests/ — app/routers/*_test.py are FastAPI routers, not pytest.
        run: pytest -q tests/ -o asyncio_mode=auto

  # ── CD: deploy to GCE VM over SSH (main only) ──────────────────────────────
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GCE over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            SRC_DIR="${{ secrets.SRC_DIR }}"
            COMPOSE_DIR="${{ secrets.COMPOSE_DIR }}"
            APP_USER="${{ secrets.APP_USER }}"

            sudo -u "$APP_USER" git -C "$SRC_DIR" fetch --all --prune
            sudo -u "$APP_USER" git -C "$SRC_DIR" checkout main
            sudo -u "$APP_USER" git -C "$SRC_DIR" pull --ff-only origin main

            # COMPOSE_DIR is owned by APP_USER — use sudo + project-directory (no cd).
            sudo docker compose \
              --project-directory "$COMPOSE_DIR" \
              -f "$COMPOSE_DIR/docker-compose.yml" \
              up -d --build api

            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8000/health >/dev/null; then
                echo "health ok"
                exit 0
              fi
              sleep 2
            done
            echo "health check failed"
            sudo docker compose --project-directory "$COMPOSE_DIR" -f "$COMPOSE_DIR/docker-compose.yml" ps
            exit 1

  # ── Notify: deploy result → ops alert relay → Telegram (main only) ─────────
  notify:
    needs: [test, deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Send result to Telegram
        env:
          RELAY_URL: https://reeltime-alerts-377818572638.asia-southeast1.run.app
          RELAY_TOKEN: ${{ secrets.ALERT_RELAY_TOKEN }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          # Passed via env, never inlined into the script (commit text is untrusted).
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RELAY_TOKEN" ]; then
            echo "ALERT_RELAY_TOKEN secret not set; skipping"
            exit 0
          fi
          commit="${GITHUB_SHA::7} $(printf '%s\n' "$COMMIT_MESSAGE" | head -n1)"
          if [ "$DEPLOY_RESULT" = success ]; then
            level=resolved  # shows as ✅
            title="movie-api deployed: $commit"
          elif [ "$TEST_RESULT" = failure ]; then
            level=error
            title="movie-api not deployed: tests failed"
          elif [ "$DEPLOY_RESULT" = failure ]; then
            level=error
            title="movie-api deploy failed"
          else
            level=warning
            title="movie-api deploy $DEPLOY_RESULT (tests $TEST_RESULT)"
          fi
          detail=$(printf 'Commit: %s\nBy: %s\n%s' "$commit" "$AUTHOR" "$RUN_URL")
          jq -n --arg level "$level" --arg title "$title" --arg detail "$detail" \
            '{source: "deploy", level: $level, title: $title, detail: $detail}' \
            | curl -fsS --max-time 20 -X POST "$RELAY_URL/event" \
                -H "Authorization: Bearer $RELAY_TOKEN" -H "Content-Type: application/json" -d @- \
            || echo "::warning::alert relay unreachable"
